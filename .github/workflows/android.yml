name: Android Debug APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Java and Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          test -d "$ANDROID_SDK_ROOT"
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Create Android debug keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=RPG Attempt,C=US"
      - name: Download Godot and export templates
        shell: bash
        run: |
          set -euo pipefail
          VERSION=4.4.1
          wget -q "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip"
          unzip -q "Godot_v${VERSION}-stable_linux.x86_64.zip"
          chmod +x "Godot_v${VERSION}-stable_linux.x86_64"
          sudo mv "Godot_v${VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          mkdir -p "$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          wget -q "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz"
          unzip -q "Godot_v${VERSION}-stable_export_templates.tpz" -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${VERSION}.stable/"
      - name: Import and validate project
        run: godot --headless --path . --editor --quit
      - name: Configure Godot Android export paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          config_dir = Path.home() / ".config" / "godot"
          candidates = sorted(config_dir.glob("editor_settings-*.tres"))
          if not candidates:
              raise SystemExit(f"Godot editor settings not found in {config_dir}")
          path = candidates[-1]
          content = path.read_text()
          java_home = os.environ["JAVA_HOME"]
          android_home = os.environ["ANDROID_SDK_ROOT"]
          for key, value in (
              ("export/android/android_sdk_path", android_home),
              ("export/android/java_sdk_path", java_home),
          ):
              line = f'{key} = "{value}"'
              if key in content:
                  import re
                  content = re.sub(r'^' + re.escape(key) + r' = .*        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/rpg-attempt-debug.apk
          test -s build/rpg-attempt-debug.apk
      - name: Diagnose export failure
        if: failure()
        shell: bash
        run: |
          echo "=== Android SDK ==="
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          echo "JAVA_HOME=${JAVA_HOME:-unset}"
          echo "=== Godot export preset ==="
          cat export_presets.cfg
          echo "=== Android signing key ==="
          ls -l "$HOME/.android/debug.keystore" || true
          echo "=== Editor settings path keys ==="
          grep -E "export/android/(android_sdk_path|java_sdk_path)" "$HOME"/.config/godot/editor_settings-*.tres || true
          echo "=== Output files ==="
          find build -maxdepth 2 -type f -ls || true
      - uses: actions/upload-artifact@v4
        with:
          name: rpg-attempt-android-debug
          path: build/rpg-attempt-debug.apk
          if-no-files-found: error
, lambda _: line, content, flags=re.M)
              else:
                  if "[resource]" not in content:
                      raise SystemExit("Unexpected Godot editor settings format")
                  content = content.replace("[resource]", "[resource]\\n" + line, 1)
          path.write_text(content)
          print(f"Configured Godot export paths in {path}")
          PY
      - name: Export APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /home/runner/.android/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/rpg-attempt-debug.apk
          test -s build/rpg-attempt-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: rpg-attempt-android-debug
          path: build/rpg-attempt-debug.apk
          if-no-files-found: error
